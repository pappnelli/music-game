<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .theme-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .theme-light { display: none; }
      .theme-dark { display: inline; }
    }
  </style>

  <defs>
    <linearGradient id="discFaceLight" gradientUnits="userSpaceOnUse" x1="3" y1="1" x2="61" y2="59">
      <stop offset="0%" stop-color="#ff2ec4"/>
      <stop offset="49%" stop-color="#ff2ec4"/>
      <stop offset="51%" stop-color="#9b30ff"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
    <linearGradient id="discFaceDark" gradientUnits="userSpaceOnUse" x1="3" y1="1" x2="61" y2="59">
      <stop offset="0%" stop-color="#ff4dd8"/>
      <stop offset="49%" stop-color="#ff4dd8"/>
      <stop offset="51%" stop-color="#b366ff"/>
      <stop offset="100%" stop-color="#b366ff"/>
    </linearGradient>
  </defs>

  <!-- Light theme (matches the app's light palette) -->
  <g class="theme-light">
    <circle cx="32" cy="34" r="29" fill="#b32089"/>
    <circle cx="32" cy="30" r="29" fill="url(#discFaceLight)" stroke="#fdf6ff" stroke-width="2"/>
    <circle cx="32" cy="30" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="32" cy="30" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="32" cy="30" r="10.5" fill="#fdf6ff"/>
    <circle cx="32" cy="30" r="2.7" fill="#2a1240"/>
  </g>

  <!-- Dark theme (matches the app's dark palette) -->
  <g class="theme-dark">
    <circle cx="32" cy="34" r="29" fill="#b33697"/>
    <circle cx="32" cy="30" r="29" fill="url(#discFaceDark)" stroke="#2b1137" stroke-width="2"/>
    <circle cx="32" cy="30" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="32" cy="30" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="32" cy="30" r="10.5" fill="#fdf6ff"/>
    <circle cx="32" cy="30" r="2.7" fill="#2a1240"/>
  </g>
</svg>
